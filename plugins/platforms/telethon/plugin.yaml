name: telethon-platform
label: Telethon
kind: platform
version: 1.0.0
description: >
  Telegram gateway adapter for Hermes Agent built on Telethon (mtproto).
  Runs in parallel with the python-telegram-bot adapter under a SEPARATE bot
  token — one Telegram token cannot hold two simultaneous connections, so this
  plugin requires its own @BotFather bot. The PTB plugin files are never touched.
author: NousResearch
requires_env:
  - name: TELETHON_API_ID
    description: "Telegram API ID from my.telegram.org"
    prompt: "Telethon API ID"
    password: false
  - name: TELETHON_API_HASH
    description: "Telegram API hash from my.telegram.org"
    prompt: "Telethon API hash"
    password: true
  - name: TELETHON_BOT_TOKEN
    description: "Telegram bot token from @BotFather (a DIFFERENT bot than the PTB one)"
    prompt: "Telethon bot token"
    url: "https://t.me/BotFather"
    password: true
optional_env:
  - name: TELETHON_ALLOWED_USERS
    description: "Comma-separated Telegram user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: TELETHON_ALLOW_ALL_USERS
    description: "Allow any Telegram user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: TELETHON_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: TELETHON_HOME_CHANNEL_NAME
    description: "Display name for the Telethon home channel"
    prompt: "Home channel display name"
    password: false
  - name: TELETHON_PROXY
    description: "SOCKS5 proxy host:port:user:pass (e.g. 45.38.107.97:6014:user:pass)"
    prompt: "SOCKS5 proxy (host:port:user:pass)"
    password: false
  - name: TELETHON_SESSION_NAME
    description: "Telethon session file name (default: hermes_telethon_bot)"
    prompt: "Session name"
    password: false
